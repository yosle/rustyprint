# The Node.js package's tests while it is a proposal. In a pull request it would become a `node`
# job in ci.yml, next to `ruby` and `dotnet`, with its own entry in the `changes` filters.
name: Node.js package

on:
  push:
    branches: [node-binding]
    paths:
      - crates/**
      - Cargo.*
      - schema/**
      - bindings/node/**
      - demos/samples/**
      - .github/workflows/node.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98"

jobs:
  node:
    name: Node.js package (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest and newest Node.js LTS on Linux, and the newest elsewhere.
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Builds the native library with Cargo, then runs the tests against it.
      - run: npm test
      - name: Render every sample
        if: matrix.node == '24'
        shell: bash
        run: npm run --silent render-samples -- samples | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: samples-${{ runner.os }}
          path: bindings/node/samples/

  # Whether every platform gives the same bytes for each sample.
  samples:
    name: Same PDFs on every platform
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: samples-*
      - name: Compare the PDFs' SHA-256
        run: |
          {
            echo "## SHA-256 of each sample, by platform"
            for file in samples-*/sha256.txt; do
              echo
              echo "${file%%/*}:"
              echo '```'
              cat "$file"
              echo '```'
            done
            echo
            if [ "$(sort -u samples-*/sha256.txt | wc -l)" -eq "$(wc -l < samples-Linux/sha256.txt)" ]; then
              echo "**Every platform gave byte-identical PDFs.**"
            else
              echo "**The platforms gave different PDFs.**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
